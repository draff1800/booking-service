spring.application.name=booking-service

logging.level.com.draff1800.booking_service=INFO
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [${spring.application.name}] [correlationId=%X{correlationId:-}] [%thread] %logger{36} - %msg%n%wEx

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never
management.health.redis.enabled=${REDIS_ENABLED:false}
management.health.rabbit.enabled=${RABBITMQ_ENABLED:false}
management.info.build.enabled=true

app.cache.redis-enabled=${REDIS_ENABLED:false}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false

app.messaging.rabbit.enabled=${RABBITMQ_ENABLED:false}
app.messaging.outbox.publish-delay-ms=${RABBITMQ_OUTBOX_PUBLISH_DELAY_MS:5000}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

JWT_SECRET=${JWT_SECRET}
JWT_TIME_TO_LIVE_SECONDS=${JWT_TIME_TO_LIVE_SECONDS:900}
