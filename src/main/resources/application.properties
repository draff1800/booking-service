spring.application.name=booking-service

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

app.cache.redis-enabled=${REDIS_ENABLED:false}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false

app.messaging.rabbit.enabled=${RABBITMQ_ENABLED:true}
app.messaging.outbox.publish-delay-ms=${OUTBOX_PUBLISH_DELAY_MS:5000}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

JWT_SECRET=${JWT_SECRET}
JWT_TIME_TO_LIVE_SECONDS=${JWT_TIME_TO_LIVE_SECONDS}
